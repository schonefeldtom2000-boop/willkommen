<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Willkommen zurück</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var SKIN = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAACVElEQVR4Xu2ZO04DMRCGHUUbIQEFHSkQBSAhCiROwAHCAejhGkkBHIMDcABygFwAOoQEVClCRwFIiCgKcsiMvN5dz/qR3YDna7K7ycx4/h2PrbghCLqD4RRvHLg83mrgzRJCDo4F4ArgKcA9ABuCA9wEeRXwWwahCetCFj23pVGmy48+vkV7rYX3krxnLpgSgLHJWNedndTvzvsvU4hv8kFBCiCDv76PxVF7FZ9J7kefYnM98RbBNHg5Noh/e7qf+t3JzeMU4pt8UJACLBqfwYeABVCaCYgShO5giNcmlAoIXYmlKmsmACSfN2hVGPg+75mKyZ/OXABIPm/QqjB5Ypls8r5LYTUFbBIrC/eAupsgvoo5VEVQA6bsKWz995/fRGd3g7QrImOkB9ChAlH2FDb+ZfLA3dmh0a6IjBGVgM0AXXD1T9kVkTEqCgBQgSh7Chv/UP7y07kCfAe8rEBSV4SgCxPgYq+J1yJJRO/hC2+roFYBZsknSSbPKkWoV4CDFUwahRiPWQCugAr7wPJMAYW4BGg2hZhMMHlJXALkkCeALFXjQu1IrVNAgvsAZTmMSgDJxfZEiNbvn6a9p/R0AP5tBdRN6SmAV5HCAkT64hEWAKWIFBYg0hePsAAoRaSwAJG+eIQFQCkihQWI9MUjLABKEQjqqM3m8FPie/5PEdypnoAOlYh++gu4nv5SBHcaUgAVys6V4E6LEgCoRPQK8D3/p/B2SiW8KCAo9acnhZexhAXgCuApwD0AG0KFcBOci82rAC+DvA/w2st4GUt4H/DH9wE/32mRUBTcrGYAAAAQZGVCRzM4NTZCQTA0ODc0QUMzNEWplOB9AAAAAElFTkSuQmCC';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W, H, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = cv.width = Math.round(innerWidth * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- Minecraft-artige Pixelschrift (5x7) ---------- */
  var GL = {
    'W': ['#...#','#...#','#...#','#.#.#','#.#.#','##.##','#...#'],
    'i': ['#','.','#','#','#','#','#'],
    'l': ['#','#','#','#','#','#','#'],
    'k': ['#...','#...','#..#','#.#.','##..','#.#.','#..#'],
    'o': ['.....','.....','.###.','#...#','#...#','#...#','.###.'],
    'm': ['.....','.....','####.','#.#.#','#.#.#','#.#.#','#.#.#'],
    'e': ['.....','.....','.###.','#...#','#####','#....','.###.'],
    'n': ['.....','.....','####.','#...#','#...#','#...#','#...#'],
    'z': ['.....','.....','#####','...#.','..#..','.#...','#####'],
    'u': ['.....','.....','#...#','#...#','#...#','#...#','.####'],
    'r': ['.....','.....','#.##.','##..#','#....','#....','#....'],
    'ü': ['.#.#.','.....','#...#','#...#','#...#','#...#','.####'],
    'c': ['.....','.....','.###.','#...#','#....','#...#','.###.'],
    '!': ['#','#','#','#','#','.','#']
  };
  function gw(ch) { return ch === ' ' ? 3 : GL[ch][0].length; }
  function measure(str) {
    var w = 0;
    for (var i = 0; i < str.length; i++) w += gw(str[i]) + 1;
    return w - 1;
  }
  function drawText(str, x, y, s, color, shadow, count) {
    var pass, i, r, c, cx, g;
    for (pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? shadow : color;
      var off = pass === 0 ? s : 0;
      cx = 0;
      for (i = 0; i < str.length && i < count; i++) {
        var ch = str[i];
        if (ch !== ' ') {
          g = GL[ch];
          for (r = 0; r < 7; r++)
            for (c = 0; c < g[r].length; c++)
              if (g[r][c] === '#')
                ctx.fillRect(Math.round(x + (cx + c) * s + off), Math.round(y + r * s + off), s, s);
        }
        cx += gw(ch) + 1;
      }
    }
  }

  /* ---------- Hintergrund (Erde-Look) ---------- */
  var bg;
  function makeBg() {
    var cols = 16, rows = Math.ceil(16 * H / W);
    bg = document.createElement('canvas');
    bg.width = cols; bg.height = rows;
    var g = bg.getContext('2d');
    for (var y = 0; y < rows; y++)
      for (var x = 0; x < cols; x++) {
        var b = 55 + Math.floor(Math.random() * 40);
        g.fillStyle = 'rgb(' + (b + 22) + ',' + (b - 4) + ',' + (b - 28) + ')';
        g.fillRect(x, y, 1, 1);
      }
  }

  /* ---------- Skin-Teile ---------- */
  var P = {};
  function mk(img, a, b) {
    var c = document.createElement('canvas');
    c.width = a[2]; c.height = a[3];
    var g = c.getContext('2d');
    g.drawImage(img, a[0], a[1], a[2], a[3], 0, 0, a[2], a[3]);
    if (b) g.drawImage(img, b[0], b[1], a[2], a[3], 0, 0, a[2], a[3]);
    return c;
  }
  function buildParts(img) {
    P.head = mk(img, [8, 8, 8, 8], [40, 8]);
    P.body = mk(img, [20, 20, 8, 12], [20, 36]);
    P.rArm = mk(img, [44, 20, 4, 12], [44, 36]);
    P.lArm = mk(img, [36, 52, 4, 12], [52, 52]);
    P.rLeg = mk(img, [4, 20, 4, 12], [4, 36]);
    P.lLeg = mk(img, [20, 52, 4, 12], [4, 52]);
  }

  /* ---------- Hilfsfunktionen ---------- */
  function clamp(v) { return Math.max(0, Math.min(1, v)); }
  function smooth(a, b, t) { t = clamp((t - a) / (b - a)); return t * t * (3 - 2 * t); }
  function easeOut(t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); }

  var LINE1 = 'Willkommen', LINE2 = 'zurück!';
  var DUR = 4.8;

  function frame(t) {
    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    var alpha = smooth(0, 0.35, t) * (1 - smooth(DUR - 0.5, DUR, t));
    ctx.globalAlpha = alpha;

    // Hintergrund
    ctx.drawImage(bg, 0, 0, bg.width, bg.height, 0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Layout
    var land = W > H * 1.1;
    var s, u, tx1, tx2, ty, lh, sx, sy;
    if (land) {
      s = Math.max(2, Math.floor(Math.min(W * 0.5 / 48, H * 0.5 / 17)));
      u = Math.max(2, Math.floor(H * 0.56 / 32));
      tx1 = Math.round(W * 0.08); tx2 = tx1;
      lh = 10 * s;
      ty = Math.round(H / 2 - (17 * s) / 2);
      sx = W - 16 * u - Math.round(W * 0.09);
      sy = Math.round(H / 2 - 16 * u);
    } else {
      s = Math.max(2, Math.floor(Math.min(W * 0.8 / 48, H * 0.2 / 17)));
      u = Math.max(2, Math.floor(Math.min(H * 0.38 / 32, W * 0.5 / 16)));
      tx1 = Math.round((W - measure(LINE1) * s) / 2);
      tx2 = Math.round((W - measure(LINE2) * s) / 2);
      lh = 10 * s;
      ty = Math.round(H * 0.12);
      sx = W - 16 * u - Math.round(W * 0.08);
      sy = Math.round(H * 0.45);
    }

    // Text tippt sich nacheinander
    var n = Math.max(0, Math.floor((t - 0.35) / 0.075));
    drawText(LINE1, tx1, ty, s, '#ffffff', '#3f3f3f', n);
    drawText(LINE2, tx2, ty + lh, s, '#ffaa00', '#2a1a00', Math.max(0, n - LINE1.length));

    // Skin kommt von rechts rein
    var enter = easeOut((t - 0.7) / 0.7);
    var dx = (1 - enter) * W * 0.7;
    var bob = t > 1.4 ? Math.sin((t - 1.4) * 5) * 0.12 * u : 0;
    var ox = sx + dx, oy = sy + bob;

    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(ox + 8 * u, sy + 32 * u + u * 0.6, 7 * u, 1.3 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    function put(c, ux, uy) {
      ctx.drawImage(c, 0, 0, c.width, c.height, Math.round(ox + ux * u), Math.round(oy + uy * u), c.width * u, c.height * u);
    }
    put(P.rLeg, 4, 20);
    put(P.lLeg, 8, 20);
    put(P.body, 4, 8);
    put(P.lArm, 12, 8);
    put(P.head, 4, 0);

    // Winkender Arm (Skin-rechter Arm, links im Bild)
    var wt = t - 1.4;
    var lift = smooth(0, 0.4, wt) * (1 - smooth(2.1, 2.5, wt));
    var ang = lift * (2.35 + 0.3 * Math.sin(Math.max(0, wt) * 14));
    ctx.save();
    ctx.translate(ox + 2 * u, oy + 10 * u);
    ctx.rotate(ang);
    ctx.drawImage(P.rArm, 0, 0, 4, 12, -2 * u, -2 * u, 4 * u, 12 * u);
    ctx.restore();

    ctx.globalAlpha = 1;
  }

  /* ---------- Start ---------- */
  var img = new Image();
  var raf = 0, t0 = 0, done = false;
  function finish() {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    try { window.close(); } catch (e) {}
  }
  function loop(now) {
    if (!t0) t0 = now;
    var t = (now - t0) / 1000;
    if (t >= DUR) { finish(); return; }
    frame(t);
    raf = requestAnimationFrame(loop);
  }
  img.onload = function () {
    buildParts(img);
    makeBg();
    raf = requestAnimationFrame(loop);
  };
  img.src = SKIN;
  addEventListener('resize', function () { if (bg) makeBg(); });
  // Tippen = sofort schließen
  addEventListener('pointerdown', finish);
})();
</script>
</body>
</html>
